ShortDescription: AI download manager for Windows — download smarter, go further.
Description: |-
  DOVIRA is an open-source AI download manager (IDM-like) for Windows: video/audio downloads via yt-dlp, fast plain-file downloads via aria2, a browser extension with one-click pairing, a rule-based AI assistant that answers in Bangla and English, smart queue, live-stream recording, channel subscriptions, and in-app preview. Fully local — no account, no data leaves the machine.
