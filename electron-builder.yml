appId: com.khalid635.dovira
productName: dovira
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!extension/**'
  - '!resources/setup-guide.mp4'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Phase 5: the built extension ships as real files (not inside the asar),
# so users can load it unpacked straight from the install folder:
# <install dir>\resources\extension
extraResources:
  - from: extension/dist
    to: extension
# v1.3.1: the setup-guide video ships as a real file (not inside the asar),
# so swapping it later is one file replace — no rebuild, no code change:
# <install dir>\resources\setup-guide.mp4
  - from: resources/setup-guide.mp4
    to: setup-guide.mp4
asarUnpack:
  - resources/**
win:
  executableName: dovira
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Phase 6: macOS ships as an UNSIGNED dmg (notarization needs a paid
# Apple Developer account, ~$99/yr, not agreed). Gatekeeper will block a
# first launch — the README has the right-click > Open instructions.
# The entitlements file exists in build/ (kept); the old extendInfo
# (camera/mic/Documents/Downloads) is dropped — the app uses none of
# those APIs, so claiming them would be a lie to the user.
mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Khalid Bin Masud
  category: Utility
  # Phase 6: WM_CLASS / .desktop association for Linux desktops
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Phase 6: auto-update reads latest.yml from these GitHub Releases
# (electron-updater). Releases are pre-releases; the CI workflow creates
# them on tag push — never create one by hand.
publish:
  provider: github
  owner: Khalid635
  repo: dovira
  releaseType: prerelease
