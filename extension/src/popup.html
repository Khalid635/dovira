<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOVIRA</title>
    <style>
      body { width: 360px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; background: #0f1115; color: #e7e9ee; font-size: 13px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      #status { padding: 8px; border-radius: 8px; background: #171a21; margin-bottom: 10px; }
      #status.ok { color: #22c55e; }
      #status.bad { color: #ef4444; }
      .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #2a2f3a; }
      .row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row small { color: #8b93a5; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { cursor: pointer; border: 0; border-radius: 8px; background: #5b8cff; color: #fff; font-size: 12px; padding: 6px 10px; }
      button:disabled { opacity: 0.6; cursor: default; }
      #empty { color: #8b93a5; padding: 12px 0; }
      a { color: #7aa2ff; }
    </style>
  </head>
  <body>
    <h1>DOVIRA</h1>
    <div id="status">Checking app…</div>
    <div id="links"></div>
    <div id="empty" hidden>No links on this page.</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
