<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOVIRA architecture · Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* DOVIRA skin — exact tokens from src/renderer/src/assets/main.css [data-theme='light'] */
      --color-paper:   #edf4ee;   /* --bg (mint) */
      --color-ink:     #122b21;   /* --text (deep green) */
      --color-muted:   #5f7268;   /* --muted */
      --color-soft:    #4e6156;   /* darker green-grey, derived from --muted for 4.5:1 text */
      --color-accent:  #12805c;   /* --accent (emerald) */
      --color-accent-text: #0e6a4c; /* --accent-hover, for accent text at 4.5:1 */
      --color-link:    #2e5aa8;   /* HTTP/API (skill default; no repo link blue exists) */
      --font-sans:     'Inter', system-ui, sans-serif;  /* DOVIRA brand sans */
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · DOVIRA v1.3.1</p>
    <h1>How DOVIRA fits together</h1>

    <div class="diagram-container">

        </defs>

        <rect width="100%" height="100%" fill="#edf4ee"/>

        <!-- Zones (drawn before arrows and nodes) -->

        <rect x="102" y="68" width="52" height="12" rx="2" fill="#edf4ee"/>
        <text x="128" y="77" fill="#4e6156" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

        <text x="480" y="77" fill="#4e6156" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ELECTRON APP · v1.3.1</text>

        <rect x="744" y="64" width="168" height="320" rx="8"
              fill="rgba(18,43,33,0.02)" stroke="rgba(18,43,33,0.10)" stroke-width="0.8"/>
        <rect x="780" y="68" width="96" height="12" rx="2" fill="#edf4ee"/>

              text-anchor="middle" letter-spacing="0.14em">BUNDLED ENGINES</text>

        <!-- Main -> aria2: download -->

        <!-- Main -> ffmpeg: merge / convert -->

        <line x1="390" y1="232" x2="390" y2="256" stroke="#5f7268" stroke-width="1.2" marker-end="url(#arrow)"/>

        <circle cx="570" cy="316" r="2" fill="#122b21"/>

        <rect x="261" y="184" width="48" height="12" rx="2" fill="#edf4ee"/>
        <text x="285" y="193" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT</text>

        <text x="336" y="191" fill="#0e6a4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIN</text>
        <text x="480" y="208" fill="#122b21" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Main process</text>
        <text x="480" y="224" fill="#5f7268" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">queue · fetchInfo · Local API :17530</text>

        <!-- Node: SQLite (store) -->
